[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dhbw-moodle-sync"
version = "1.0.1"
description = "Lädt deine Moodle-Kursdateien automatisch in sortierte Ordner und hält sie aktuell."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julien Armbruster" }]
keywords = ["moodle", "dhbw", "studium", "sync", "download"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: German",
]
dependencies = []

[project.scripts]
moodle-sync = "moodle_sync.cli:main"

[project.urls]
Homepage = "https://github.com/julienarmbruster/dhbw-moodle-sync"
Issues = "https://github.com/julienarmbruster/dhbw-moodle-sync/issues"

[tool.setuptools.packages.find]
where = ["src"]
